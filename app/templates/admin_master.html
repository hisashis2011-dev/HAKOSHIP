{% extends "base.html" %}
{% block content %}
<h1>{{ m.title }}</h1>
<div class="grid2">
<form method="post" action="/admin/master/{{ kind }}" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <h2>追加 / 更新</h2>
  <label>コード<input name="code" required maxlength="30"></label>
  <label>名称<input name="name" required></label>
  <label><input type="checkbox" name="is_active" value="1" checked> 有効</label>
  <button class="btn primary">保存</button>
</form>
<form method="post" action="/admin/master/{{ kind }}/import" enctype="multipart/form-data" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <h2>CSV一括登録</h2>
  <p class="small muted">列: <code>code,name</code>（既存コードは名称を更新し有効化）</p>
  <input type="file" name="file" accept=".csv" required>
  <button class="btn primary">取り込む</button>
</form>
</div>
<div class="tablewrap"><table>
<tr><th>コード</th><th>名称</th><th>状態</th><th></th></tr>
{% for p in rows %}
<tr class="{{ 'off' if not p.is_active }}">
  <form method="post" action="/admin/master/{{ kind }}"><input type="hidden" name="csrf_token" value="{{ csrf }}">
  <td><input type="hidden" name="code" value="{{ p.code }}">{{ p.code }}</td>
  <td><input name="name" value="{{ p.name }}"></td>
  <td><label><input type="checkbox" name="is_active" value="1" {{ 'checked' if p.is_active }}> 有効</label></td>
  <td><button class="btn">保存</button></td></form>
</tr>
{% endfor %}
</table></div>
{% endblock %}

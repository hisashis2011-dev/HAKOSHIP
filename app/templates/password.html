{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>パスワード変更</h1>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>現在のパスワード<input type="password" name="current" required autocomplete="current-password"></label>
    <label>新しいパスワード(10文字以上)<input type="password" name="new" required minlength="10" autocomplete="new-password"></label>
    <button class="primary block">変更する</button>
  </form>
</div>
{% endblock %}
